<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "outline": "#909097", "error": "#ef4444", "on-primary": "#283044", "secondary": "#44e2cd", "surface-dark": "#1e293b", "secondary-fixed-dim": "#3cddc7", "tertiary-fixed": "#fcdeb5", "surface-container-high": "#2a2a2b", "on-secondary": "#003731", "success": "#22c55e", "on-secondary-container": "#004d44", "surface": "#131315", "on-tertiary": "#3e2d11", "on-primary-fixed-variant": "#3f465c", "secondary-fixed": "#62fae3", "on-background": "#e4e2e4", "on-tertiary-fixed-variant": "#574425", "surface-tint": "#bec6e0", "surface-container-low": "#1b1b1d", "on-primary-fixed": "#131b2e", "primary-fixed": "#dae2fd", "primary-fixed-dim": "#bec6e0", "warning": "#f59e0b", "surface-dim": "#131315", "primary-container": "#0f172a", "on-secondary-fixed": "#00201c", "surface-bright": "#39393b", "secondary-container": "#03c6b2", "primary": "#bec6e0", "surface-variant": "#353436", "on-tertiary-container": "#957d5a", "on-error": "#690005", "surface-container": "#1f1f21", "on-secondary-fixed-variant": "#005047", "inverse-primary": "#565e74", "border-muted": "#334155", "on-surface": "#e4e2e4", "on-primary-container": "#798098", "inverse-on-surface": "#303032", "inverse-surface": "#e4e2e4", "outline-variant": "#45464d", "surface-container-highest": "#353436", "surface-container-lowest": "#0e0e10", "on-surface-variant": "#c6c6cd", "tertiary-container": "#231500", "tertiary": "#dec29a", "error-container": "#93000a", "on-error-container": "#ffdad6", "background": "#131315", "tertiary-fixed-dim": "#dec29a", "on-tertiary-fixed": "#271901" } } } }</script><style>@layer base { body { -webkit-tap-highlight-color: transparent; } .pb-safe { padding-bottom: env(safe-area-inset-bottom); } .pt-safe { padding-top: env(safe-area-inset-top); } }</style></head><body class="bg-background text-on-background font-body-md pt-safe pb-safe"><main class="relative w-full h-full"><div class="flex flex-col w-full h-full items-center justify-center p-4 bg-background pt-safe pb-safe">
<div class="flex flex-col items-center justify-center space-y-6 w-full max-w-sm">
<!-- Success Icon Container -->
<div class="relative flex items-center justify-center w-24 h-24 bg-surface-dark rounded-full shadow-lg border border-border-muted overflow-hidden">
<!-- Pulsing ring effect -->
<div class="absolute inset-0 bg-success/20 rounded-full animate-pulse" style="animation-duration: 2s;"></div>
<div class="absolute inset-2 bg-surface-dark rounded-full border border-success/30"></div>
<!-- Icon -->
<span class="material-symbols-outlined text-success" style="font-size: 48px; font-variation-settings: 'FILL' 1;">
        check_circle
      </span>
</div>
<!-- Text Content -->
<div class="text-center space-y-2">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background">SmartBox Active</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs mx-auto">Your telemetry unit has been successfully provisioned and is securely connected to the operational network.</p>
</div>
<!-- Details Card -->
<div class="w-full bg-surface-dark rounded-xl border border-border-muted p-4 space-y-4 shadow-sm mt-4">
<!-- Status Row -->
<div class="flex justify-between items-center">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">System Status</span>
<div class="flex items-center space-x-2 bg-success/10 border border-success/20 rounded-full px-3 py-1">
<span class="w-2 h-2 rounded-full bg-success animate-pulse"></span>
<span class="font-label-caps text-label-caps text-success font-bold tracking-widest">ACTIVE</span>
</div>
</div>
<div class="w-full h-px bg-border-muted"></div>
<!-- Code Row -->
<div class="flex justify-between items-center">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">SmartBox Code</span>
<span class="font-status-lg text-status-lg text-on-background tracking-tight">SB-X100</span>
</div>
<!-- Connectivity Row (Faux Data) -->
<div class="flex justify-between items-center">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Signal Strength</span>
<div class="flex items-center space-x-1 text-secondary">
<span class="material-symbols-outlined text-[16px] leading-none" style="font-variation-settings: 'FILL' 1;">signal_cellular_alt</span>
<span class="font-body-sm text-body-sm text-secondary font-medium">-65 dBm</span>
</div>
</div>
</div>
<!-- Spacer to push button down if needed, or keep tight -->
<div class="h-8 w-full"></div>
<!-- Action Button -->
<button class="w-full bg-secondary hover:bg-secondary-fixed text-on-secondary font-label-caps text-label-caps rounded-lg py-4 px-6 flex items-center justify-center space-x-2 transition-colors duration-200 shadow-md">
<span>CONTINUE TO MONITORING</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<!-- Secondary minimal link (optional but good for operations) -->
<button class="w-full text-center py-3">
<span class="font-label-caps text-label-caps text-outline hover:text-on-background transition-colors uppercase tracking-wider">View Diagnostic Logs</span>
</button>
</div>
</div>
<script>
  // Simple entry animation logic to make it feel responsive
  document.addEventListener("DOMContentLoaded", () => {
    const container = document.querySelector('.max-w-sm');
    container.style.opacity = '0';
    container.style.transform = 'translateY(10px)';
    container.style.transition = 'opacity 0.4s ease-out, transform 0.4s ease-out';
    
    requestAnimationFrame(() => {
      container.style.opacity = '1';
      container.style.transform = 'translateY(0)';
    });
  });
</script></main></body></html>
