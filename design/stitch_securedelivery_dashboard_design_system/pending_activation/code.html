-area-inset-top); } }</style></head><body class="bg-background text-on-background font-body-md pt-safe pb-safe"><main class="relative w-full h-full"><div class="flex flex-col w-full h-full p-6 pb-8 bg-background justify-between">
<div class="flex flex-col flex-1 items-center justify-center space-y-stack-lg max-w-sm mx-auto w-full">
<div class="flex flex-col items-center text-center space-y-stack-md w-full">
<div class="w-16 h-16 bg-surface-dark border border-border-muted rounded-xl flex items-center justify-center shadow-md mb-2">

<h1 class="text-headline-lg-mobile text-on-background font-headline-lg-mobile">SmartBox Setup</h1>
<div class="flex items-center space-x-2 bg-surface-container-high px-3 py-1 rounded-full border border-border-muted">
<div class="w-2 h-2 rounded-full bg-outline"></div>

</div>
<p class="text-body-md text-on-surface-variant font-body-md px-4 mt-4">
                 This phone will act as the SecureDelivery SmartBox monitoring device.
             </p>
</div>
<div class="w-full aspect-square max-w-[280px] bg-surface-dark border border-border-muted rounded-xl flex flex-col items-center justify-center p-8 shadow-sm relative overflow-hidden group">
<div class="absolute inset-0 bg-gradient-to-br from-primary/5 via-transparent to-secondary/5 opacity-50"></div>
<div class="relative w-full h-full border-2 border-dashed border-outline-variant rounded-lg flex items-center justify-center bg-surface-container-low transition-colors duration-300">
<div class="absolute w-8 h-8 border-t-2 border-l-2 border-secondary top-0 left-0 -translate-x-0.5 -translate-y-0.5"></div>
<div class="absolute w-8 h-8 border-t-2 border-r-2 border-secondary top-0 right-0 translate-x-0.5 -translate-y-0.5"></div>
<div class="absolute w-8 h-8 border-b-2 border-l-2 border-secondary bottom-0 left-0 -translate-x-0.5 translate-y-0.5"></div>
<div class="absolute w-8 h-8 border-b-2 border-r-2 border-secondary bottom-0 right-0 translate-x-0.5 translate-y-0.5"></div>
<span class="material-symbols-outlined text-outline text-[48px] opacity-50">qr_code_scanner</span>
<div class="absolute inset-0 w-full h-0.5 bg-secondary/30 shadow-[0_0_8px_rgba(45,212,191,0.5)] scan-line hidden"></div>
</div>
</div>
</div>
<div class="flex flex-col space-y-stack-sm w-full max-w-sm mx-auto mt-auto pt-6">
<button class="w-full bg-secondary text-on-secondary font-label-caps text-label-caps py-4 rounded-lg flex items-center justify-center space-x-2 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined text-[20px]">camera_alt</span>
<span>SCAN QR CODE</span>
</button>
<button class="w-full bg-transparent text-secondary font-label-caps text-label-caps py-4 rounded-lg flex items-center justify-center space-x-2 active:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-[20px]">keyboard</span>
<span>ENTER CODE MANUALLY</span>
</button>
</div>
</div>
<script>
    // Simulate scan line animation randomly to make it feel 'alive'
    document.addEventListener('DOMContentLoaded', () => {
        const scanLine = document.querySelector('.scan-line');
        if(!scanLine) return;

        function animateScanLine() {
            scanLine.classList.remove('hidden');
            
            // Setup CSS animation dynamically if not present
            if (!document.getElementById('scan-animation-style')) {
                const style = document.createElement('style');
                style.id = 'scan-animation-style';
                style.textContent = `
                    @keyframes scan {
                        0% { top: 10%; opacity: 0; }
                        10% { opacity: 1; }
                        90% { opacity: 1; }
                        100% { top: 90%; opacity: 0; }
                    }
                    .animate-scan {
                        animation: scan 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
                    }
                `;
                document.head.appendChild(style);
            }

            scanLine.classList.add('animate-scan');
            
            setTimeout(() => {
                scanLine.classList.remove('animate-scan');
                scanLine.classList.add('hidden');
                
                // Random next scan between 3 and 8 seconds
                const nextScan = Math.random() * 5000 + 3000;
                setTimeout(animateScanLine, nextScan);
            }, 2000);
        }

        // Start first scan after a short delay
        setTimeout(animateScanLine, 1000);
    });
</script></main></body></html>
